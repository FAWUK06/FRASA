<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Schedule Manager</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

:root {
    --primary: #6a5af9;
    --secondary: #d946ef;
    --bg: #f4f5ff;
    --card: #ffffff;
    --text: #333;
    --muted: #777;
    --border: #e5e5f5;
    --success: #00b86b;
    --danger: #ff4d6d;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #6a5af9, #d946ef, #ff6b6b);
    padding: 25px;
    color: var(--text);
    transition: 0.3s;
}

body.dark {
    --bg: #151525;
    --card: #202033;
    --text: #eee;
    --muted: #aaa;
    --border: #393950;

    background: linear-gradient(135deg, #17152d, #302040, #241b2f);
}

.app {
    max-width: 1250px;
    margin: auto;
    background: var(--card);
    border-radius: 25px;
    padding: 30px;
    box-shadow: 0 20px 50px rgba(0,0,0,.25);
}

/* HEADER */

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 25px;
}

.title h1 {
    color: var(--primary);
    font-size: 34px;
}

.title p {
    color: var(--muted);
    margin-top: 6px;
}

.header-buttons {
    display: flex;
    gap: 10px;
}

.icon-btn {
    border: none;
    background: #eeeaff;
    color: var(--primary);
    padding: 12px 16px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 16px;
}

.icon-btn:hover {
    transform: translateY(-2px);
}

/* DATE */

.date-box {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: white;
    padding: 15px 20px;
    border-radius: 15px;
    text-align: center;
}

.date-box span {
    display: block;
    font-size: 13px;
    opacity: .9;
}

.date-box strong {
    font-size: 18px;
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.stat {
    padding: 20px;
    border-radius: 18px;
    color: white;
    text-align: center;
}

.stat:nth-child(1) {
    background: linear-gradient(135deg,#ff7b7b,#ff4d6d);
}

.stat:nth-child(2) {
    background: linear-gradient(135deg,#00c6ff,#0072ff);
}

.stat:nth-child(3) {
    background: linear-gradient(135deg,#00d084,#00a86b);
}

.stat:nth-child(4) {
    background: linear-gradient(135deg,#ffb347,#ff7b00);
}

.stat h2 {
    font-size: 28px;
}

.stat p {
    margin-top: 5px;
}

/* TOOLBAR */

.toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.toolbar input,
.toolbar select {
    padding: 12px;
    border: 2px solid var(--border);
    border-radius: 12px;
    outline: none;
    background: var(--card);
    color: var(--text);
}

.toolbar input {
    flex: 1;
    min-width: 200px;
}

.toolbar select {
    min-width: 160px;
}

.add-btn {
    border: none;
    padding: 12px 20px;
    border-radius: 12px;
    background: linear-gradient(135deg,var(--primary),var(--secondary));
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.add-btn:hover {
    transform: translateY(-2px);
}

/* TABLE */

.schedule-container {
    overflow-x: auto;
    border-radius: 18px;
    border: 1px solid var(--border);
}

.schedule-table {
    width: 100%;
    border-collapse: collapse;
    min-width: 850px;
}

.schedule-table th {
    background: linear-gradient(135deg,var(--primary),var(--secondary));
    color: white;
    padding: 15px;
    text-align: center;
}

.schedule-table td {
    border: 1px solid var(--border);
    padding: 10px;
    vertical-align: top;
    min-width: 140px;
    height: 110px;
    background: var(--card);
}

.time-column {
    width: 90px;
    min-width: 90px !important;
    text-align: center;
    font-weight: bold;
    color: var(--primary);
}

.schedule-item {
    padding: 10px;
    border-radius: 10px;
    color: white;
    margin-bottom: 6px;
    cursor: pointer;
    box-shadow: 0 3px 8px rgba(0,0,0,.12);
}

.schedule-item:hover {
    transform: translateY(-2px);
}

.schedule-item.completed {
    opacity: .5;
    text-decoration: line-through;
}

.schedule-item .task-title {
    font-weight: bold;
    margin-bottom: 5px;
}

.schedule-item .task-category {
    font-size: 11px;
}

.schedule-item .task-actions {
    display: flex;
    gap: 5px;
    margin-top: 8px;
}

.small-btn {
    border: none;
    padding: 4px 7px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 11px;
}

.edit {
    background: white;
    color: #555;
}

.delete {
    background: #ffdddd;
    color: #e33;
}

/* COLORS */

.study {
    background: linear-gradient(135deg,#6a5af9,#8c7cff);
}

.work {
    background: linear-gradient(135deg,#0072ff,#00a8ff);
}

.exercise {
    background: linear-gradient(135deg,#00a86b,#00d084);
}

.personal {
    background: linear-gradient(135deg,#ff7b7b,#ff4d6d);
}

.entertainment {
    background: linear-gradient(135deg,#ff9f43,#ff6b00);
}

.important {
    background: linear-gradient(135deg,#d946ef,#ff4db8);
}

/* PROGRESS */

.progress-container {
    margin-top: 25px;
}

.progress-bar {
    height: 13px;
    background: #e8e8f2;
    border-radius: 20px;
    overflow: hidden;
}

.progress {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg,#00d084,#00a86b);
    transition: .4s;
}

.progress-text {
    margin-top: 8px;
    color: var(--muted);
}

/* MODAL */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 1000;
}

.modal.active {
    display: flex;
}

.modal-content {
    width: 100%;
    max-width: 500px;
    background: var(--card);
    color: var(--text);
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,.3);
}

.modal-content h2 {
    margin-bottom: 20px;
    color: var(--primary);
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 12px;
    border: 2px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    color: var(--text);
    outline: none;
}

.modal-buttons {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.modal-buttons button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
}

.save-btn {
    background: var(--primary);
    color: white;
}

.cancel-btn {
    background: #ddd;
    color: #333;
}

/* RESPONSIVE */

@media(max-width:900px) {

    body {
        padding: 12px;
    }

    .app {
        padding: 18px;
    }

    header {
        flex-direction: column;
        align-items: stretch;
    }

    .stats {
        grid-template-columns: repeat(2,1fr);
    }

    .date-box {
        width: 100%;
    }
}

@media(max-width:550px) {

    .stats {
        grid-template-columns: 1fr 1fr;
    }

    .title h1 {
        font-size: 27px;
    }

    .header-buttons {
        justify-content: space-between;
    }
}
</style>
</head>

<body>

<div class="app">

<header>

    <div class="title">
        <h1>📅 My Schedule</h1>
        <p>Kelola jadwal harianmu dengan mudah.</p>
    </div>

    <div class="header-buttons">
        <button class="icon-btn" onclick="toggleDarkMode()">
            🌙 Mode
        </button>

        <div class="date-box">
            <span>Hari Ini</span>
            <strong id="today"></strong>
        </div>
    </div>

</header>


<!-- STATISTICS -->

<div class="stats">

    <div class="stat">
        <h2 id="totalTasks">0</h2>
        <p>Total Jadwal</p>
    </div>

    <div class="stat">
        <h2 id="completedTasks">0</h2>
        <p>Selesai</p>
    </div>

    <div class="stat">
        <h2 id="remainingTasks">0</h2>
        <p>Belum Selesai</p>
    </div>

    <div class="stat">
        <h2 id="todayTasks">0</h2>
        <p>Hari Ini</p>
    </div>

</div>


<!-- TOOLBAR -->

<div class="toolbar">

    <input
        type="text"
        id="search"
        placeholder="🔍 Cari jadwal..."
        oninput="renderSchedule()"
    >

    <select id="filterCategory" onchange="renderSchedule()">
        <option value="all">📂 Semua Kategori</option>
        <option value="study">📚 Study</option>
        <option value="work">💼 Work</option>
        <option value="exercise">🏃 Exercise</option>
        <option value="personal">🏠 Personal</option>
        <option value="entertainment">🎮 Entertainment</option>
        <option value="important">⭐ Important</option>
    </select>

    <select id="filterStatus" onchange="renderSchedule()">
        <option value="all">📋 Semua Status</option>
        <option value="completed">✅ Selesai</option>
        <option value="pending">⏳ Belum Selesai</option>
    </select>

    <button class="add-btn" onclick="openModal()">
        ➕ Tambah Jadwal
    </button>

</div>


<!-- TABLE -->

<div class="schedule-container">

<table class="schedule-table">

<thead>

<tr>
    <th class="time-column">Waktu</th>
    <th>Senin</th>
    <th>Selasa</th>
    <th>Rabu</th>
    <th>Kamis</th>
    <th>Jumat</th>
    <th>Sabtu</th>
    <th>Minggu</th>
</tr>

</thead>

<tbody id="scheduleBody"></tbody>

</table>

</div>


<!-- PROGRESS -->

<div class="progress-container">

    <div class="progress-bar">
        <div class="progress" id="progress"></div>
    </div>

    <div class="progress-text" id="progressText">
        0% selesai
    </div>

</div>

</div>


<!-- MODAL -->

<div class="modal" id="taskModal">

<div class="modal-content">

<h2 id="modalTitle">➕ Tambah Jadwal</h2>

<div class="form-group">

<label>Nama Jadwal</label>

<input
    type="text"
    id="taskName"
    placeholder="Contoh: Belajar Matematika"
>

</div>


<div class="form-group">

<label>Tanggal</label>

<input type="date" id="taskDate">

</div>


<div class="form-group">

<label>Waktu</label>

<input type="time" id="taskTime">

</div>


<div class="form-group">

<label>Kategori</label>

<select id="category">

    <option value="study">📚 Study</option>
    <option value="work">💼 Work</option>
    <option value="exercise">🏃 Exercise</option>
    <option value="personal">🏠 Personal</option>
    <option value="entertainment">🎮 Entertainment</option>
    <option value="important">⭐ Important</option>

</select>

</div>


<div class="modal-buttons">

<button class="cancel-btn" onclick="closeModal()">
    Batal
</button>

<button class="save-btn" onclick="saveTask()">
    💾 Simpan
</button>

</div>

</div>

</div>


<script>

let tasks = JSON.parse(localStorage.getItem("mySchedule")) || [];

let editingId = null;


/* =========================
   DATE
========================= */

function getTodayString() {

    const date = new Date();

    const year = date.getFullYear();

    const month =
        String(date.getMonth() + 1).padStart(2,"0");

    const day =
        String(date.getDate()).padStart(2,"0");

    return `${year}-${month}-${day}`;
}


function displayDate() {

    const today = new Date();

    document.getElementById("today").textContent =
        today.toLocaleDateString("id-ID", {
            weekday:"short",
            day:"numeric",
            month:"short",
            year:"numeric"
        });

    document.getElementById("taskDate").value =
        getTodayString();
}


/* =========================
   MODAL
========================= */

function openModal(id = null) {

    editingId = id;

    const modal =
        document.getElementById("taskModal");

    modal.classList.add("active");

    if (id !== null) {

        const task =
            tasks.find(t => t.id === id);

        if (!task) return;

        document.getElementById("modalTitle").textContent =
            "✏️ Edit Jadwal";

        document.getElementById("taskName").value =
            task.name;

        document.getElementById("taskDate").value =
            task.date;

        document.getElementById("taskTime").value =
            task.time;

        document.getElementById("category").value =
            task.category;

    } else {

        document.getElementById("modalTitle").textContent =
            "➕ Tambah Jadwal";

        document.getElementById("taskName").value = "";

        document.getElementById("taskDate").value =
            getTodayString();

        document.getElementById("taskTime").value = "";

        document.getElementById("category").value =
            "study";
    }
}


function closeModal() {

    document
        .getElementById("taskModal")
        .classList.remove("active");

    editingId = null;
}


/* =========================
   SAVE TASK
========================= */

function saveTask() {

    const name =
        document.getElementById("taskName").value.trim();

    const date =
        document.getElementById("taskDate").value;

    const time =
        document.getElementById("taskTime").value;

    const category =
        document.getElementById("category").value;


    if (!name) {

        alert("Silakan masukkan nama jadwal!");

        return;
    }


    if (!date) {

        alert("Silakan pilih tanggal!");

        return;
    }


    if (editingId !== null) {

        tasks = tasks.map(task => {

            if (task.id === editingId) {

                return {
                    ...task,
                    name,
                    date,
                    time,
                    category
                };

            }

            return task;

        });

    } else {

        tasks.push({

            id: Date.now(),

            name,

            date,

            time,

            category,

            completed:false

        });

    }


    saveData();

    renderSchedule();

    closeModal();
}


/* =========================
   DISPLAY TABLE
========================= */

function renderSchedule() {

    const body =
        document.getElementById("scheduleBody");

    const search =
        document.getElementById("search")
        .value
        .toLowerCase();

    const categoryFilter =
        document.getElementById("filterCategory").value;

    const statusFilter =
        document.getElementById("filterStatus").value;


    let filtered =
        tasks.filter(task => {

            const matchSearch =
                task.name
                .toLowerCase()
                .includes(search);

            const matchCategory =
                categoryFilter === "all" ||
                task.category === categoryFilter;

            const matchStatus =
                statusFilter === "all" ||
                (statusFilter === "completed" && task.completed) ||
                (statusFilter === "pending" && !task.completed);

            return (
                matchSearch &&
                matchCategory &&
                matchStatus
            );

        });


    /*
       Jam yang digunakan untuk membuat
       baris tabel.
    */

    const times = [

        "06:00",
        "07:00",
        "08:00",
        "09:00",
        "10:00",
        "11:00",
        "12:00",
        "13:00",
        "14:00",
        "15:00",
        "16:00",
        "17:00",
        "18:00",
        "19:00",
        "20:00",
        "21:00"

    ];


    body.innerHTML = "";


    times.forEach(time => {

        const row =
            document.createElement("tr");


        const timeCell =
            document.createElement("td");

        timeCell.className =
            "time-column";

        timeCell.textContent =
            time;

        row.appendChild(timeCell);


        /*
           0 = Minggu
           1 = Senin
           ...
           6 = Sabtu
        */

        for (let day = 1; day <= 7; day++) {

            const cell =
                document.createElement("td");


            const dayTasks =
                filtered.filter(task => {

                    if (!task.time) return false;

                    if (task.time.substring(0,2) !==
                        time.substring(0,2)) {
                        return false;
                    }


                    const date =
                        new Date(
                            task.date + "T00:00:00"
                        );

                    let jsDay =
                        date.getDay();

                    let convertedDay =
                        jsDay === 0 ? 7 : jsDay;

                    return convertedDay === day;

                });


            dayTasks.forEach(task => {

                const item =
                    document.createElement("div");

                item.className =
                    `schedule-item ${task.category}`;

                if (task.completed) {
                    item.classList.add("completed");
                }


                const title =
                    document.createElement("div");

                title.className =
                    "task-title";

                title.textContent =
                    task.name;


                const cat =
                    document.createElement("div");

                cat.className =
                    "task-category";

                cat.textContent =
                    getCategoryName(task.category);


                const actions =
                    document.createElement("div");

                actions.className =
                    "task-actions";


                const completeBtn =
                    document.createElement("button");

                completeBtn.className =
                    "small-btn edit";

                completeBtn.textContent =
                    task.completed
                    ? "↩️ Batal"
                    : "✅ Selesai";

                completeBtn.onclick =
                    () => toggleTask(task.id);


                const editBtn =
                    document.createElement("button");

                editBtn.className =
                    "small-btn edit";

                editBtn.textContent =
                    "✏️ Edit";

                editBtn.onclick =
                    () => openModal(task.id);


                const deleteBtn =
                    document.createElement("button");

                deleteBtn.className =
                    "small-btn delete";

                deleteBtn.textContent =
                    "🗑️";

                deleteBtn.onclick =
                    () => deleteTask(task.id);


                actions.appendChild(completeBtn);

                actions.appendChild(editBtn);

                actions.appendChild(deleteBtn);


                item.appendChild(title);

                item.appendChild(cat);

                item.appendChild(actions);


                cell.appendChild(item);

            });


            row.appendChild(cell);

        }


        body.appendChild(row);

    });


    updateStats();
}


/* =========================
   CATEGORY
========================= */

function getCategoryName(category) {

    const names = {

        study: "📚 Study",

        work: "💼 Work",

        exercise: "🏃 Exercise",

        personal: "🏠 Personal",

        entertainment: "🎮 Entertainment",

        important: "⭐ Important"

    };

    return names[category] || category;
}


/* =========================
   TOGGLE
========================= */

function toggleTask(id) {

    tasks = tasks.map(task => {

        if (task.id === id) {

            return {
                ...task,
                completed: !task.completed
            };

        }

        return task;

    });


    saveData();

    renderSchedule();
}


/* =========================
   DELETE
========================= */

function deleteTask(id) {

    const task =
        tasks.find(t => t.id === id);

    if (!task) return;


    const confirmed =
        confirm(
            `Hapus jadwal "${task.name}"?`
        );


    if (!confirmed) return;


    tasks =
        tasks.filter(task => task.id !== id);


    saveData();

    renderSchedule();
}


/* =========================
   STATISTICS
========================= */

function updateStats() {

    const total =
        tasks.length;

    const completed =
        tasks.filter(
            task => task.completed
        ).length;

    const remaining =
        total - completed;


    const today =
        getTodayString();

    const todayTasks =
        tasks.filter(
            task => task.date === today
        ).length;


    document.getElementById(
        "totalTasks"
    ).textContent = total;


    document.getElementById(
        "completedTasks"
    ).textContent = completed;


    document.getElementById(
        "remainingTasks"
    ).textContent = remaining;


    document.getElementById(
        "todayTasks"
    ).textContent = todayTasks;


    const percentage =
        total === 0
        ? 0
        : Math.round(
            (completed / total) * 100
        );


    document.getElementById(
        "progress"
    ).style.width =
        percentage + "%";


    document.getElementById(
        "progressText"
    ).textContent =
        `${percentage}% selesai — ${completed} dari ${total} jadwal`;
}


/* =========================
   LOCAL STORAGE
========================= */

function saveData() {

    localStorage.setItem(
        "mySchedule",
        JSON.stringify(tasks)
    );
}


/* =========================
   DARK MODE
========================= */

function toggleDarkMode() {

    document.body.classList.toggle("dark");

    const dark =
        document.body.classList.contains("dark");

    localStorage.setItem(
        "darkMode",
        dark
    );
}


/* =========================
   LOAD DARK MODE
========================= */

function loadDarkMode() {

    const dark =
        localStorage.getItem("darkMode");

    if (dark === "true") {

        document.body.classList.add("dark");

    }
}


/* =========================
   CLOSE MODAL
========================= */

document.getElementById("taskModal")
    .addEventListener("click", function(e) {

        if (e.target === this) {

            closeModal();

        }

    });


/* =========================
   KEYBOARD SHORTCUT
========================= */

document.addEventListener("keydown", function(e) {

    if (e.key === "Escape") {

        closeModal();

    }

});


/* =========================
   INITIALIZE
========================= */

loadDarkMode();

displayDate();

renderSchedule();

</script>

</body>
</html>
